name: m5d3-general
services:
  general-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: general_db
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample-only-pass
    volumes:
    - general-data:/var/lib/postgresql/data
    # 새 DB 볼륨이면 아래 SQL을 첫 실행에 자동 적용한다. 수동 실행은 필요 없다.
    # 기존 DB 볼륨에는 다시 적용하지 않는다.
    - ./general/sql/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
    - general-data-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sample -d general_db
      interval: 3s
      timeout: 3s
      retries: 20
  general-api:
    build: ./general
    volumes:
    - ./classroom-logs:/classroom-logs
    environment:
      DB_HOST: general-db
      DB_PORT: '5432'
      DB_NAME: general_db
      DB_USER: sample
      DB_PASSWORD: sample-only-pass
      EVENT_TOKEN: local-sample-event-token-not-for-public-deployment
      SECRET_KEY: sample-general-session-key-not-for-production
      MONITOR_URL: http://monitor-api:5000/api/events
      REQUEST_LOG_PATH: /classroom-logs/app.jsonl
    depends_on:
      general-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
    - general-front-net
    - general-data-net
    - events-net
  general-gateway:
    image: nginx:1.28-alpine
    ports:
    - 127.0.0.1:8081:80
    volumes:
    - ./gateways/general.conf:/etc/nginx/conf.d/default.conf:ro
    - ./classroom-logs:/classroom-logs
    networks:
    - general-front-net
    depends_on:
      general-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  general-data: {}
networks:
  general-front-net: {}
  general-data-net: {}
  events-net: {}
