name: m5d4-general
services:
  general-db:
    build: ./general/sql
    environment:
      POSTGRES_DB: general_db
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample-only-pass
    volumes:
    - general-data:/var/lib/postgresql/data
    networks:
    - general-data-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sample -d general_db
      interval: 3s
      timeout: 3s
      retries: 20
  general-api:
    build: ./general
    volumes:
    - classroom-logs:/classroom-logs
    command:
    - sh
    - -c
    - python seed_classroom.py && exec waitress-serve --host=0.0.0.0 --port=$$PORT app:app
    environment:
      DB_HOST: general-db
      DB_PORT: '5432'
      DB_NAME: general_db
      DB_USER: sample
      DB_PASSWORD: sample-only-pass
      EVENT_TOKEN: day4-local-event-token-not-for-public-deployment
      SECRET_KEY: day4-general-session-key-not-for-production
      MONITOR_URL: http://monitor-api:5000/api/events
      REQUEST_LOG_PATH: /classroom-logs/app.jsonl
    depends_on:
      general-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
    - general-front-net
    - general-data-net
    - events-net
  general-gateway:
    build:
      context: ./gateways
      dockerfile: Dockerfile.general
    ports:
    - 127.0.0.1:8083:80
    volumes:
    - classroom-logs:/classroom-logs
    networks:
    - general-front-net
    depends_on:
      general-api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  general-data: {}
  classroom-logs:
    external: true
    name: m5d4-classroom-logs
networks:
  general-front-net: {}
  general-data-net: {}
  events-net:
    external: true
    name: m5d4-events
