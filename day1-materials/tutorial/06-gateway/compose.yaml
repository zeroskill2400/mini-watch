name: m5d1-sample
services:
  api:
    build: ./flask
    image: m5d1-flask:2
    environment:
      DB_HOST: db
      DB_NAME: sample_db
      DB_USER: sample
      DB_PASSWORD: sample-only-pass
    depends_on:
      db:
        condition: service_healthy
    networks:
    - front-net
    - data-net
  web:
    build: ./next
    image: m5d1-next:2
    environment:
      API_URL: http://api:5000
    depends_on:
    - api
    networks:
    - front-net
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: sample_db
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample-only-pass
    volumes:
    - sample-data:/var/lib/postgresql/data
    - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sample -d sample_db
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
    - data-net
  gateway:
    image: nginx:1.28-alpine
    ports:
    - 127.0.0.1:8085:80
    volumes:
    - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
    - front-net
    depends_on:
    - api
    - web
volumes:
  sample-data: {}
networks:
  front-net: {}
  data-net: {}
