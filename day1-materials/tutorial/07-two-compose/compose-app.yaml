name: m5d1-app
services:
  api:
    build: ./flask
    image: m5d1-flask:2
    environment:
      DB_HOST: db
      DB_NAME: sample_db
      DB_USER: sample
      DB_PASSWORD: sample-only-pass
    networks:
    - front-net
    - data-net
  web:
    build: ./next
    image: m5d1-next:2
    environment:
      API_URL: http://api:5000
    depends_on:
    - api
    networks:
    - front-net
  gateway:
    image: nginx:1.28-alpine
    ports:
    - 127.0.0.1:8085:80
    volumes:
    - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
    - front-net
    depends_on:
    - api
    - web
networks:
  front-net: {}
  data-net:
    external: true
    name: m5d1-shared-data
