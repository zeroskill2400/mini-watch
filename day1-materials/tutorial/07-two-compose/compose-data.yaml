name: m5d1-sample
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: sample_db
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample-only-pass
    volumes:
    - sample-data:/var/lib/postgresql/data
    - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sample -d sample_db
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
    - data-net
volumes:
  sample-data: {}
networks:
  data-net:
    external: true
    name: m5d1-shared-data
