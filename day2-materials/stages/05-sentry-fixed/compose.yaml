name: m5d2-sample
services:
  api:
    build: ./flask
    image: m5d2-flask:3
    env_file:
      - ./flask/.env
    ports:
      - "127.0.0.1:5600:5000"
  web:
    build: ./next
    image: m5d2-next:1
    environment:
      API_BASE: http://api:5000
    ports:
      - "127.0.0.1:3600:3000"
    depends_on:
      - api
