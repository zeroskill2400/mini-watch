<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="630" viewBox="0 0 1040 630"><rect width="1040" height="630" fill="#f4f7fb"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#246c91"/></marker></defs><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="35" y="48" font-size="32" fill="#19384e" font-weight="bold">Flask 기록을 같은 항목으로 읽기</text><text x="35" y="86" font-size="23" fill="#19384e" font-weight="normal">실제 원본의 값과 분석을 위해 붙이는 표식을 구분한다.</text><rect x="30" y="112" width="430" height="390" rx="12" fill="white" stroke="#95afc3" stroke-width="2"/><text x="52" y="154" font-size="27" fill="#19384e" font-weight="bold">Flask 원본 한 건</text><text x="54" y="223" font-size="27" fill="#19384e" font-weight="normal">method     GET</text><text x="54" y="285" font-size="27" fill="#19384e" font-weight="normal">path          /</text><text x="54" y="347" font-size="27" fill="#19384e" font-weight="normal">status_code  200</text><text x="54" y="442" font-size="25" fill="#8a5819" font-weight="normal">시각·ID는 원본에 없음</text><path d="M472,285 L539,285" stroke="#246c91" stroke-width="4" marker-end="url(#arrow)"/><rect x="555" y="112" width="455" height="390" rx="12" fill="white" stroke="#95afc3" stroke-width="2"/><text x="577" y="154" font-size="27" fill="#19384e" font-weight="bold">공통 기록</text><text x="579" y="213" font-size="25" fill="#19384e" font-weight="normal">id: app-1  /  source: app</text><text x="579" y="266" font-size="25" fill="#19384e" font-weight="normal">time: None</text><text x="579" y="319" font-size="25" fill="#19384e" font-weight="normal">method: GET  /  path: /</text><text x="579" y="372" font-size="25" fill="#19384e" font-weight="normal">status_code: 200</text><text x="579" y="425" font-size="25" fill="#19384e" font-weight="normal">raw: 원본 한 건 그대로</text><text x="35" y="557" font-size="26" fill="#246c91" font-weight="bold">그대로 읽음: 요청 방법·경로·상태</text><text x="35" y="600" font-size="24" fill="#19384e" font-weight="normal">새 표식: 이름·출처  /  None: 시각 없음  /  raw: 되짚을 원본</text></g></svg>
