<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#286aa6"/></marker></defs><rect width="1000" height="570" fill="#f6f8fc"/><g font-family="Arial, Noto Sans KR, sans-serif" fill="#18324d"><text x="30" y="40" font-size="24" font-weight="bold">기록의 모양을 맞추고 의미를 보존하기</text><rect x="30" y="75" width="290" height="125" rx="8" fill="#e3efff" stroke="#9db1c5"/><text x="45" y="105" font-size="19">HTTP 예제 · h1</text><text x="45" y="140" font-size="17">GET /demo/error · 500</text><text x="45" y="168" font-size="17">request_id: demo-r42</text><path d="M175,205 L175,250" fill="none" stroke="#286aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="255" width="290" height="155" rx="8" fill="#fff" stroke="#9db1c5"/><text x="45" y="285" font-size="18">공통 필드 · 의미 보존</text><text x="45" y="320" font-size="17">source: http_demo</text><text x="45" y="349" font-size="17">시각: 예제 수신 시각</text><text x="45" y="378" font-size="17">원본: h1</text><rect x="353" y="75" width="290" height="125" rx="8" fill="#fff0de" stroke="#9db1c5"/><text x="368" y="105" font-size="19">Sentry 오류 예제 · s1</text><text x="368" y="140" font-size="17">ZeroDivisionError</text><text x="368" y="168" font-size="17">request_id: demo-r42</text><path d="M498,205 L498,250" fill="none" stroke="#286aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="353" y="255" width="290" height="155" rx="8" fill="#fff" stroke="#9db1c5"/><text x="368" y="285" font-size="18">공통 필드 · 의미 보존</text><text x="368" y="320" font-size="17">source: sentry_demo</text><text x="368" y="349" font-size="17">시각: 예제 오류 발생 시각</text><text x="368" y="378" font-size="17">원본: s1</text><rect x="676" y="75" width="290" height="125" rx="8" fill="#e4f4e9" stroke="#9db1c5"/><text x="691" y="105" font-size="19">감사 예제 · a1</text><text x="691" y="140" font-size="17">person: user-17</text><text x="691" y="168" font-size="17">action: login_failure</text><path d="M821,205 L821,250" fill="none" stroke="#286aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="676" y="255" width="290" height="155" rx="8" fill="#fff" stroke="#9db1c5"/><text x="691" y="285" font-size="18">공통 필드 · 의미 보존</text><text x="691" y="320" font-size="17">source: audit_demo</text><text x="691" y="349" font-size="17">actor: employee-17</text><text x="691" y="378" font-size="17">원본: a1</text><text x="30" y="455" font-size="20">교육용 예제를 형식에 맞추되 출처·시각·원본ID는 남긴다.</text><text x="30" y="493" font-size="18">실제 HTTP는 monitor DB의 수신 시각이다. 없는 사용자·IP를 채우지 않는다.</text><text x="30" y="530" font-size="18">별개 자료를 같은 사건으로 묶으려면 확인된 식별자와 시간 조건이 필요하다.</text></g></svg>