<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#286aa6"/></marker></defs><rect width="1000" height="570" fill="#f6f8fc"/><g font-family="Arial, Noto Sans KR, sans-serif" fill="#18324d"><text x="30" y="40" font-size="24" font-weight="bold">패킷 한 개에서 같은5초의 전체 양으로</text><rect x="35" y="85" width="225" height="120" rx="8" fill="#e3efff" stroke="#9db1c5"/><text x="55" y="115" font-size="21">저장된 두 파일</text><text x="55" y="155" font-size="18">normal.pcap · 4개</text><text x="55" y="185" font-size="18">observed.pcap · 8개</text><path d="M267,145 L340,145" fill="none" stroke="#286aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="80" width="615" height="140" rx="8" fill="#fff" stroke="#9db1c5"/><text x="370" y="110" font-size="21">첫 패킷 · Ethernet / IP / TCP / 자료</text><rect x="370" y="140" width="107" height="55" rx="8" fill="#dfebff" stroke="#9db1c5"/><text x="382" y="175" font-size="17">Ethernet</text><rect x="485" y="140" width="107" height="55" rx="8" fill="#e3f4e9" stroke="#9db1c5"/><text x="497" y="175" font-size="17">IP</text><rect x="600" y="140" width="107" height="55" rx="8" fill="#fff0d8" stroke="#9db1c5"/><text x="612" y="175" font-size="17">TCP</text><rect x="715" y="140" width="207" height="55" rx="8" fill="#e8e5ff" stroke="#9db1c5"/><text x="727" y="175" font-size="17">자료</text><text x="370" y="244" font-size="18">192.0.2.10:40001 → 198.51.100.20:443</text><text x="35" y="305" font-size="21">두 파일 모두 첫 패킷부터5초 · 같은 길이의 관찰 구간</text><text x="35" y="350" font-size="20">정상 244bytes</text><rect x="230" y="330" width="122" height="32" fill="#5893c7"/><text x="35" y="407" font-size="20">관찰 1220bytes</text><rect x="230" y="386" width="610" height="32" fill="#dc8753"/><path d="M474 315V438" stroke="#c04848" stroke-width="3" stroke-dasharray="7,5" fill="none"/><text x="490" y="333" font-size="18">기준: 정상2배 = 488bytes</text><text x="35" y="485" font-size="19">패킷의 전체 저장 바이트를 센다. TCP/UDP 모두 포함한다.</text><text x="35" y="527" font-size="18">합성 파일의 결과이며 실제 일반 서비스의 HTTP 요청 수와 합치지 않는다.</text></g></svg>