<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440"><rect width="1040" height="440" rx="18" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3b689a"/></marker></defs><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#203a57"><text x="28" y="38" font-size="24" font-weight="bold">두 출처의 변환 결과를 같은 목록에 넣기</text><rect x="28" y="72" width="260" height="124" rx="12" fill="#ffffff" stroke="#b9cde3" stroke-width="2"/><text x="44" y="103" font-size="20" font-weight="bold">case[&quot;app&quot;] · 2행</text><text x="44" y="137" font-size="17">GET / → 200</text><text x="44" y="165" font-size="17">GET /training-missing → 404</text><rect x="28" y="226" width="260" height="124" rx="12" fill="#ffffff" stroke="#b9cde3" stroke-width="2"/><text x="44" y="257" font-size="20" font-weight="bold">case[&quot;nginx&quot;] · 2행</text><text x="44" y="291" font-size="17">GET / → 200</text><text x="44" y="319" font-size="17">GET /training-missing → 404</text><rect x="340" y="72" width="302" height="124" rx="12" fill="#ffffff" stroke="#b9cde3" stroke-width="2"/><text x="356" y="103" font-size="20" font-weight="bold">normalize_app</text><text x="356" y="137" font-size="17">앱 객체 → 공통 모양</text><text x="356" y="165" font-size="17">app-1, app-2</text><rect x="340" y="226" width="302" height="124" rx="12" fill="#ffffff" stroke="#b9cde3" stroke-width="2"/><text x="356" y="257" font-size="20" font-weight="bold">normalize_nginx</text><text x="356" y="291" font-size="17">문자열 → 공통 모양</text><text x="356" y="319" font-size="17">nginx-1, nginx-2</text><rect x="716" y="106" width="296" height="228" rx="12" fill="#e9f1ff" stroke="#b9cde3" stroke-width="2"/><text x="732" y="137" font-size="20" font-weight="bold">events · 한 목록</text><text x="732" y="171" font-size="17">app-1    app      200</text><text x="732" y="199" font-size="17">app-2    app      404</text><text x="732" y="227" font-size="17">nginx-1  nginx   200</text><text x="732" y="255" font-size="17">nginx-2  nginx   404</text><text x="732" y="283" font-size="17">len(events) → 4</text><g fill="none" stroke="#3b689a" stroke-width="3" marker-end="url(#arrow)"><path d="M292 132H333"/><path d="M292 286H333"/><path d="M647 132H687V160H710"/><path d="M647 286H687V278H710"/></g><text x="653" y="96" font-size="16">append</text><text x="653" y="326" font-size="16">append</text><text x="28" y="415" font-size="18">분석 대상 요청 2건 → 앱 2행 + Nginx 2행. 관측 4행을 요청 4건으로 세지 않는다.</text></g></svg>