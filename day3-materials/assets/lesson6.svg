<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#286aa6"/></marker></defs><rect width="1000" height="570" fill="#f6f8fc"/><g font-family="Arial, Noto Sans KR, sans-serif" fill="#18324d"><text x="30" y="40" font-size="24" font-weight="bold">근거를 설명할 수 있는 감시 결과 완성하기</text><rect x="30" y="80" width="290" height="140" rx="8" fill="#e3efff" stroke="#9db1c5"/><text x="45" y="115" font-size="20">실제 HTTP</text><text x="45" y="158" font-size="16">최근60초 · 조회12 / 기준10</text><text x="45" y="198" font-size="18">출처마다 별도 기준</text><path d="M175,228 L175,265" fill="none" stroke="#286aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="353" y="80" width="290" height="140" rx="8" fill="#fff0de" stroke="#9db1c5"/><text x="368" y="115" font-size="20">합성 PCAP</text><text x="368" y="158" font-size="16">각 파일5초 · 1220bytes</text><text x="368" y="198" font-size="18">출처마다 별도 기준</text><path d="M498,228 L498,265" fill="none" stroke="#286aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="676" y="80" width="290" height="140" rx="8" fill="#e3f4e9" stroke="#9db1c5"/><text x="691" y="115" font-size="20">교육용 감사 자료</text><text x="691" y="158" font-size="16">IOC 5건 / 사용자·시간 1건</text><text x="691" y="198" font-size="18">출처마다 별도 기준</text><path d="M821,228 L821,265" fill="none" stroke="#286aa6" stroke-width="3" marker-end="url(#arrow)"/><rect x="30" y="275" width="940" height="135" rx="8" fill="#fff" stroke="#9db1c5"/><text x="50" y="310" font-size="22">감시 화면: 출처 · 관찰값 · 기준 · 후보 여부</text><text x="50" y="354" font-size="19">근거 보기: HTTP 원본ID / PCAP 파일 / 감사 원본ID</text><text x="50" y="387" font-size="19">왜 후보인지 읽고 추가 확인할 사실을 말한다.</text><text x="35" y="465" font-size="20">HTTP 기준10 → 20: 같은조회12의 후보 여부만 바뀐다.</text><text x="35" y="507" font-size="20">새 관찰: 이전ID 제외 · 원본DB 유지</text><text x="35" y="545" font-size="18">독립 자료를 한 침해 사건으로 확정하거나 자동 차단하지 않는다.</text></g></svg>