<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440"><rect width="1040" height="440" rx="18" fill="#f4f7fc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#3b689a"/></marker></defs><g font-family="Arial,Apple SD Gothic Neo,sans-serif" fill="#203a57"><text x="28" y="38" font-size="24" font-weight="bold">같은 상태 조건으로 오류 관측 세기</text><rect x="28" y="80" width="312" height="244" rx="12" fill="#e9f1ff" stroke="#b9cde3" stroke-width="2"/><text x="44" y="111" font-size="20" font-weight="bold">events · 전체 4행</text><text x="44" y="145" font-size="17">app-1     app       200</text><text x="44" y="173" font-size="17">app-2     app       404</text><text x="44" y="201" font-size="17">nginx-1   nginx    200</text><text x="44" y="229" font-size="17">nginx-2   nginx    404</text><rect x="394" y="116" width="270" height="174" rx="12" fill="#ffffff" stroke="#b9cde3" stroke-width="2"/><text x="410" y="147" font-size="20" font-weight="bold">같은 오류 조건</text><text x="410" y="181" font-size="17">status_code &gt;= 400</text><text x="410" y="209" font-size="17">app-2, nginx-2</text><text x="410" y="237" font-size="17">errors · 2행</text><rect x="720" y="100" width="292" height="224" rx="12" fill="#e9f1ff" stroke="#b9cde3" stroke-width="2"/><text x="736" y="131" font-size="20" font-weight="bold">build_report 반환값</text><text x="736" y="165" font-size="17">ready: True</text><text x="736" y="193" font-size="17">total_count: 4</text><text x="736" y="221" font-size="17">error_count: 2</text><text x="736" y="249" font-size="17">events: 전체 4행</text><g fill="none" stroke="#3b689a" stroke-width="3" marker-end="url(#arrow)"><path d="M346 172H386"/><path d="M670 172H712"/><path d="M180 329V369H863V332"/></g><text x="345" y="359" font-size="17">전체 events는 줄이지 않고 함께 반환한다</text><text x="28" y="415" font-size="18">전체 4행은 유지하고 오류 관측 2행을 센다. 오류 관측 수는 공격 횟수가 아니다.</text></g></svg>