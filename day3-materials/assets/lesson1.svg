<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490"><rect width="1000" height="490" fill="#f7f9fc"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#2866a5"/></marker></defs><g font-family="Apple SD Gothic Neo,NanumGothic,sans-serif" fill="#182b43"><text x="30" y="35" font-size="23" font-weight="700">general의 요청 기록을 monitor에 모으기</text><text x="30" y="65" font-size="16" fill="#52677d">설명용 구성도 · 화면 접속 게이트웨이와 정적 파일 요청은 생략</text><rect x="30" y="96" width="285" height="350" rx="12" fill="white" stroke="#a3b6c9"/><text x="51" y="128" font-size="21" font-weight="700">일반 서비스 · general</text><rect x="54" y="152" width="237" height="119" rx="5" fill="#eaf2fc"/><text x="74" y="184" font-size="18">Flask 게시글 기능</text><text x="74" y="217" font-size="17">작성 · 조회 · 수정 · 삭제</text><text x="74" y="247" font-size="16">요청 처리 뒤 기록 전송</text><path d="M168 274V303" stroke="#2866a5" stroke-width="2" marker-end="url(#a)"/><ellipse cx="170" cy="324" rx="92" ry="17" fill="#e9edf2" stroke="#a3b6c9"/><path d="M78 324V390C78 413 262 413 262 390V324" fill="#e9edf2" stroke="#a3b6c9"/><ellipse cx="170" cy="324" rx="92" ry="17" fill="#e9edf2" stroke="#a3b6c9"/><text x="112" y="362" font-size="18">일반 DB</text><text x="116" y="390" font-size="16">게시글 저장</text><rect x="490" y="96" width="480" height="350" rx="12" fill="white" stroke="#a3b6c9"/><text x="511" y="128" font-size="21" font-weight="700">감시 서비스 · monitor</text><rect x="516" y="152" width="195" height="119" rx="5" fill="#eaf2fc"/><text x="536" y="184" font-size="18">Flask 수집·조회 API</text><text x="536" y="217" font-size="16">POST /api/events</text><text x="536" y="247" font-size="16">요청 종류 구분</text><path d="M610 274V303" stroke="#2866a5" stroke-width="2" marker-end="url(#a)"/><ellipse cx="610" cy="324" rx="86" ry="17" fill="#e9edf2" stroke="#a3b6c9"/><path d="M524 324V390C524 413 696 413 696 390V324" fill="#e9edf2" stroke="#a3b6c9"/><ellipse