name: m5d3-monitor
services:
  monitor-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: monitor_db
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample-only-pass
    volumes:
    - monitor-data:/var/lib/postgresql/data
    # 새 DB 볼륨이면 아래 SQL을 첫 실행에 자동 적용한다. 수동 실행은 필요 없다.
    # 기존 DB 볼륨에는 다시 적용하지 않는다.
    - ./monitor/backend/sql/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
    - monitor-data-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sample -d monitor_db
      interval: 3s
      timeout: 3s
      retries: 20
  monitor-api:
    build: ./monitor/backend
    volumes:
    - ./monitor/backend/learning:/app/learning
    - ./classroom-logs:/classroom-logs:ro
    environment:
      DB_HOST: monitor-db
      DB_PORT: '5432'
      DB_NAME: monitor_db
      DB_USER: sample
      DB_PASSWORD: sample-only-pass
      EVENT_TOKEN: local-sample-event-token-not-for-public-deployment
      SECRET_KEY: sample-monitor-session-key-not-for-production
      CLASSROOM_LOG_DIR: /classroom-logs
    depends_on:
      monitor-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
    - monitor-front-net
    - monitor-data-net
    - events-net
  monitor-web:
    build: ./monitor/next-frontend
    networks:
    - monitor-front-net
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 3s
      timeout: 3s
      retries: 30
  monitor-gateway:
    image: nginx:1.28-alpine
    ports:
    - 127.0.0.1:8082:80
    volumes:
    - ./gateways/monitor.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
    - monitor-front-net
    depends_on:
      monitor-api:
        condition: service_healthy
      monitor-web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  monitor-data: {}
networks:
  monitor-front-net: {}
  monitor-data-net: {}
  events-net:
    external: true
    name: m5d3-general_events-net
