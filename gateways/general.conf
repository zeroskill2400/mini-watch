server {
    listen 80;
    access_log /classroom-logs/nginx.log combined;
    location = /health {
        access_log off;
        proxy_pass http://general-api:5000;
        proxy_set_header Host $http_host;
    }
    location / {
        proxy_pass http://general-api:5000;
        proxy_set_header Host $http_host;
    }
}
