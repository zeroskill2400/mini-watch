name: m5d3-classroom
services:
  general-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: general_db
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample-only-pass
    volumes:
    - general-data:/var/lib/postgresql/data
    - ./general/sql/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
    - general-data-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sample -d general_db
      interval: 3s
      timeout: 3s
      retries: 20
  general-api:
    build: ./general
    volumes:
    - ./classroom-logs:/classroom-logs
    command:
    - sh
    - -c
    - python seed_classroom.py && exec waitress-serve --host=0.0.0.0 --port=$$PORT
      app:app
    environment:
      DB_HOST: general-db
      DB_PORT: '5432'
      DB_NAME: general_db
      DB_USER: sample
      DB_PASSWORD: sample-only-pass
      EVENT_TOKEN: local-sample-event-token-not-for-public-deployment
      SECRET_KEY: sample-general-session-key-not-for-production
      MONITOR_URL: http://monitor-api:5000/api/events
      REQUEST_LOG_PATH: /classroom-logs/app.jsonl
    depends_on:
      general-db:
        condition: service_healthy
    networks:
    - general-front-net
    - general-data-net
    - events-net
  general-gateway:
    image: nginx:1.28-alpine
    ports:
    - 127.0.0.1:8081:80
    volumes:
    - ./gateways/general.conf:/etc/nginx/conf.d/default.conf:ro
    - ./classroom-logs:/classroom-logs
    networks:
    - general-front-net
    depends_on:
    - general-api
  monitor-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: monitor_db
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample-only-pass
    volumes:
    - monitor-data:/var/lib/postgresql/data
    - ./monitor/backend/sql/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
    - monitor-data-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sample -d monitor_db
      interval: 3s
      timeout: 3s
      retries: 20
  monitor-api:
    build: ./monitor/backend
    command:
    - sh
    - -c
    - python seed_classroom.py && exec waitress-serve --host=0.0.0.0 --port=$$PORT
      app:app
    volumes:
    - ./monitor/backend/learning:/app/learning
    - ./classroom-logs:/classroom-logs:ro
    environment:
      DB_HOST: monitor-db
      DB_PORT: '5432'
      DB_NAME: monitor_db
      DB_USER: sample
      DB_PASSWORD: sample-only-pass
      EVENT_TOKEN: local-sample-event-token-not-for-public-deployment
      SECRET_KEY: sample-monitor-session-key-not-for-production
      CLASSROOM_LOG_DIR: /classroom-logs
    depends_on:
      monitor-db:
        condition: service_healthy
    networks:
    - monitor-front-net
    - monitor-data-net
    - events-net
  monitor-web:
    build: ./monitor/next-frontend
    networks:
    - monitor-front-net
  monitor-gateway:
    image: nginx:1.28-alpine
    ports:
    - 127.0.0.1:8082:80
    volumes:
    - ./gateways/monitor.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
    - monitor-front-net
    depends_on:
    - monitor-api
    - monitor-web
volumes:
  general-data: {}
  monitor-data: {}
networks:
  general-front-net: {}
  general-data-net: {}
  events-net: {}
  monitor-front-net: {}
  monitor-data-net: {}
